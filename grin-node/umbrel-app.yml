manifestVersion: 1.1

id: grin-node
storage:
  dataRoot: data
name: Grin Node
tagline: Run a Grin Mainnet node
icon: https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node/icons/logo.png
category: crypto
version: "0.2.10"
port: 3410

description: >-
  Upgrading from a version older than 0.2.8 requires uninstalling the app
  and installing it again. Existing node data is not migrated.
  This is a one-time change introduced in 0.2.8.


  Run a Grin Mainnet node with Rust Grin or Grin++. View sync progress,
  peers, transactions and blocks in your browser.


  Open the dashboard and start a node. Use the Wallet page to connect an
  external wallet. Node Config is available for Grin++ only.

developer: wiesche89
website: https://github.com/wiesche89
submitter: wiesche89
submission: https://github.com/wiesche89/umbrel-community-app-store
repo: https://github.com/wiesche89/grin-node-controller
support: https://github.com/wiesche89/grin-node-controller/issues

gallery:
  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node/icons/galleryHome.png
  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node/icons/galleryMap.png
  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node/icons/galleryPeers.png
  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node/icons/galleryTransaction.png
  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node/icons/galleryChain.png

releaseNotes: >-
  Update the UI to 0.2.24 and the Mainnet runtime to v1.0.5.
  Fix node start/stop controls and show a notification while the node API starts.
  Protect node management behind the Umbrel login without an additional password prompt.
  External wallets connect through the dashboard URL using the node API key.

dependencies: []

path: ""
defaultUsername: ""
defaultPassword: ""
