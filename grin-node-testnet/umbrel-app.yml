manifestVersion: 1.1

id: grin-node-testnet
storage:
  dataRoot: data
name: Grin Node Testnet
tagline: Run a Grin Testnet node
icon: https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node-testnet/icons/logo.png
category: crypto
version: "0.2.31"
port: 13410

description: >-
  Upgrading from a version older than 0.2.27 requires uninstalling the app
  and installing it again. Existing node data is not migrated.
  This is a one-time change introduced in 0.2.27.


  Run a Grin Testnet node with Rust Grin or Grin++. View sync progress,
  peers, transactions and blocks in your browser.


  Open the dashboard and start a node.

developer: wiesche89
website: https://github.com/wiesche89
submitter: wiesche89
submission: https://github.com/wiesche89/umbrel-community-app-store
repo: https://github.com/wiesche89/grin-node-controller
support: https://github.com/wiesche89/grin-node-controller/issues

gallery:
  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node-testnet/icons/galleryHome.png
  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node-testnet/icons/galleryMap.png
  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node-testnet/icons/galleryPeers.png
