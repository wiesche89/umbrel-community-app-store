  - https://raw.githubusercontent.com/wiesche89/umbrel-community-app-store/master/grin-node-testnet/icons/galleryChain.png

releaseNotes: >-
  Fix the loading indicator remaining active after failed node actions.
  Reduce controller request delays and signal Rust Grin directly when stopping.
  Update the UI to 0.2.22 and controller to 0.0.4.

