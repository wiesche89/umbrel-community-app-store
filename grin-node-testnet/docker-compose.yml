version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: grin-node-testnet_ui_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/wallet/v2/foreign"

  ui:
    image: wiesche89/grin-node-docker:0.2.18@sha256:0dd095fad9b10a59b06e19861f580a213bfdd31a79fa857144bebff94848b42b
    restart: on-failure
    depends_on:
      - controller
    environment:
      CONTROLLER_PROXY: controller-testnet:8080

  controller:
    image: wiesche89/grin-node-runtime:v1.2.8@sha256:f999f2ffd54834d4788fdcf1f02a7fc1f3fe330d5d3d389236e7c6d201938b4f
    user: "1000:1000"
    init: true
    restart: on-failure
    networks:
      default:
        aliases:
          - controller-testnet
    volumes:
      - ${APP_DATA_DIR}/data/grin-rust-home:/home/appuser/.grin
      - ${APP_DATA_DIR}/data/grinpp-home:/home/appuser/.GrinPP

    ports:
      - "13414:13414"

    environment:
      HOME: /home/appuser
      GRIN_NODE_PORT: "13413"
      GRIN_RUST_BIN: "/opt/nodes/grin-rust/grin"
      GRIN_RUST_DATADIR: "/home/appuser/.grin/test"
      GRIN_RUST_ARGS: "--testnet,--no-tui"

      GRINPP_BIN: "/opt/nodes/grinpp/grin"
      GRINPP_DATADIR: "/home/appuser/.GrinPP/FLOONET"
      GRINPP_ARGS: "--floonet"
