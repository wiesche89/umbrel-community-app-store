version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: grin-node-testnet_ui_1
      APP_PORT: 80
      PROXY_AUTH_WHITELIST: "/wallet/v2/foreign"

  ui:
    image: wiesche89/grin-node-docker:0.2.21@sha256:a84b758bcfad474aca0afe9cc518013dc9fac39512ab4424fccfb351fc2a8f2a
    restart: on-failure
    depends_on:
      - controller
    environment:
      TRUSTED_PROXY_MODE: host
      CONTROLLER_PASSWORD: "${APP_GRIN_NODE_TESTNET_CONTROLLER_PASSWORD:?Controller secret is required}"
      CONTROLLER_PROXY: grin-node-testnet_controller_1:8080

  controller:
    image: wiesche89/grin-node-runtime:v1.2.9@sha256:c6304c6eba39ccef22d652f5e2c520b5a695f2a37498f04b2d3f59d5e2e015d4
    command: ["--require-auth"]
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/grin-rust-home:/home/appuser/.grin
      - ${APP_DATA_DIR}/data/grinpp-home:/home/appuser/.GrinPP

    ports:
      - "13414:13414"

    environment:
      CONTROLLER_PASSWORD: "${APP_GRIN_NODE_TESTNET_CONTROLLER_PASSWORD:?Controller secret is required}"
      HOME: /home/appuser
      GRIN_NODE_PORT: "13413"
      GRIN_RUST_BIN: "/opt/nodes/grin-rust/grin"
      GRIN_RUST_DATADIR: "/home/appuser/.grin/test"
      GRIN_RUST_ARGS: "--testnet,--no-tui"

      GRINPP_BIN: "/opt/nodes/grinpp/grin"
      GRINPP_DATADIR: "/home/appuser/.GrinPP/FLOONET"
      GRINPP_ARGS: "--floonet"
